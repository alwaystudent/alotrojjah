<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2218"/>
      <stop offset="50%" stop-color="#3D2E20"/>
      <stop offset="100%" stop-color="#1E1610"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#EAB338"/>
      <stop offset="100%" stop-color="#C88A14"/>
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EAB338" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C88A14" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.5"/>

  <!-- Islamic Rub El Hizb Star Motif -->
  <g transform="translate(256, 256)">
    <!-- Square 1 -->
    <rect x="-140" y="-140" width="280" height="280" rx="24" fill="url(#innerGlow)" stroke="url(#goldGrad)" stroke-width="8" stroke-opacity="0.9"/>
    <!-- Square 2 (Rotated 45 degrees) -->
    <rect x="-140" y="-140" width="280" height="280" rx="24" transform="rotate(45)" fill="url(#innerGlow)" stroke="url(#goldGrad)" stroke-width="8" stroke-opacity="0.9"/>

    <!-- Central Quranic Arch / Leaf Arch Motif -->
    <path d="M0 -90 C45 -55 70 -10 70 35 C70 85 35 125 0 145 C-35 125 -70 85 -70 35 C-70 -10 -45 -55 0 -90 Z" fill="url(#goldGrad)" fill-opacity="0.35" stroke="url(#goldGrad)" stroke-width="8"/>

    <!-- Inner Core Circle -->
    <circle cx="0" cy="35" r="24" fill="url(#goldGrad)"/>
    <circle cx="0" cy="35" r="10" fill="#2D2218"/>

    <!-- Decorative Dots -->
    <circle cx="0" cy="-60" r="8" fill="url(#goldGrad)"/>
  </g>
</svg>
